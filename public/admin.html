<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Inferno's Store</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="nav"><a class="brand" href="/"><span class="brand-mark">I</span><span>INFERNO'S <b>STORE</b></span></a><span class="admin-badge">OWNER PANEL</span></header>
<main class="admin section">
<div id="login-view" class="auth-card"><p class="eyebrow">RESTRICTED AREA</p><h1>Admin Login</h1><p>Only the store owner can manage games.</p><form id="login"><input name="username" placeholder="Username" autocomplete="username" required><input name="password" type="password" placeholder="Password" autocomplete="current-password" required><button class="btn primary">Sign In</button><p id="login-msg" class="msg"></p></form></div>
<div id="dash" class="hidden"><div class="section-head"><div><p class="eyebrow">OWNER PANEL</p><h1>Manage Games</h1></div><button id="logout" class="btn ghost">Log out</button></div>
<form id="game-form" class="admin-form" enctype="multipart/form-data"><h2>Add New Game</h2><div class="form-grid"><input name="name" placeholder="Game name" required><input name="genre" placeholder="Genre" required><input name="version" placeholder="Version" value="1.0.0"><input name="file_size" placeholder="File size"><input name="release_date" type="date"><input name="download_url" placeholder="Download URL (or upload file)"><textarea name="description" placeholder="Game description" required></textarea><label>Thumbnail <input name="thumbnail" type="file" accept="image/*"></label><label>Game file <input name="gameFile" type="file"></label></div><button class="btn primary">Publish Game</button><p id="form-msg" class="msg"></p></form>
<div id="admin-games" class="admin-list"></div></div></main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function check(){let r=await fetch("/api/admin/me");if(r.ok){$("#login-view").classList.add("hidden");$("#dash").classList.remove("hidden");load()}else{$("#login-view").classList.remove("hidden");$("#dash").classList.add("hidden")}}
async function load(){const games=await (await fetch("/api/games")).json();$("#admin-games").innerHTML=games.map(g=>`<div class="admin-row"><img src="${esc(g.thumbnail)}"><div><b>${esc(g.name)}</b><small>${esc(g.genre)} · ${esc(g.version)} · ${g.downloads} downloads</small></div><button class="delete btn ghost" data-id="${g.id}">Delete</button></div>`).join("")||"<p class='muted'>No games.</p>";document.querySelectorAll(".delete").forEach(b=>b.onclick=async()=>{if(confirm("Delete this game?")){await fetch("/api/admin/games/"+b.dataset.id,{method:"DELETE"});load()}})}
$("#login").onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});let d=await r.json();if(r.ok)check();else $("#login-msg").textContent=d.error};
$("#game-form").onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/admin/games",{method:"POST",body:new FormData(e.target)});let d=await r.json();$("#form-msg").textContent=r.ok?"Game published.":d.error;if(r.ok){e.target.reset();load()}};
$("#logout").onclick=async()=>{await fetch("/api/admin/logout",{method:"POST"});check()}; check();
</script></body></html>
